<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Opening Instagram…</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
    background:#0d0d10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .card{width:min(100%,420px);padding:28px;border-radius:24px;background:#18181f;
    border:1px solid #2b2b35;text-align:center}
  h1{margin:0 0 8px;font-size:26px}
  p{color:#aaaab5;line-height:1.45}
  button,a{display:block;width:100%;padding:15px;margin-top:12px;border-radius:15px;
    text-decoration:none;border:0;font:inherit;font-weight:800;cursor:pointer}
  button{background:#fff;color:#111}
  a{background:#282832;color:#fff}
  .small{font-size:12px;color:#777783;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Opening @jadeymn_</h1>
  <p id="msg">Trying to open your Instagram app…</p>
  <button id="open">Open Instagram</button>
  <a href="https://www.instagram.com/jadeymn_/">Open profile in browser</a>
  <div class="small">Some phones require one tap before a website may open another app.</div>
</div>

<script>
(() => {
  const username = "jadeymn_";
  const web = `https://www.instagram.com/${username}/`;

  // Android Intent URI: targets Instagram's package and passes the profile URL/path.
  const androidIntent =
    `intent://www.instagram.com/_u/${username}/` +
    `#Intent;scheme=https;package=com.instagram.android;` +
    `S.browser_fallback_url=${encodeURIComponent(web)};end`;

  // iOS custom scheme. If not accepted, use the HTTPS fallback.
  const iosScheme = `instagram://user?username=${username}`;

  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const msg = document.getElementById("msg");

  function launch() {
    msg.textContent = "Opening Instagram…";
    if (isAndroid) {
      location.href = androidIntent;
    } else if (isIOS) {
      let hidden = false;
      const vis = () => { if (document.hidden) hidden = true; };
      document.addEventListener("visibilitychange", vis, {once:true});
      location.href = iosScheme;
      setTimeout(() => {
        if (!hidden && !document.hidden) location.href = web;
      }, 1500);
    } else {
      location.href = web;
    }
  }

  document.getElementById("open").addEventListener("click", launch);

  // Best-effort automatic attempt after NFC opens this page.
  // Browsers may block an external-app launch without a user gesture.
  setTimeout(launch, 350);
})();
</script>
</body>
</html>
